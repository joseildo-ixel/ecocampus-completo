services:
  db:
    image: postgres:16-alpine
    container_name: ecocampus-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha123}
      POSTGRES_DB: ${POSTGRES_DB:-ecocampus}
    ports:
      - "5432:5432"
    volumes:
      - ecocampus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecocampus-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecocampus-backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-senha123}
      DB_NAME: ${POSTGRES_DB:-ecocampus}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecocampus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecocampus-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    networks:
      - ecocampus-net

volumes:
  ecocampus-postgres-data:

networks:
  ecocampus-net:
    name: ecocampus-net
    driver: bridge
